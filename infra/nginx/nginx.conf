# Resolvedor embutido do Docker.
#
# Sem isto, o nginx resolve o IP de `api` e `web` UMA VEZ, na subida, e guarda
# para sempre. Recriar qualquer um dos dois containers muda o IP e o nginx
# passa a devolver 502 até ser reiniciado — o que acontece em todo
# `docker compose up --force-recreate`.
#
# A resolução em tempo de requisição só acontece quando o destino do
# `proxy_pass` é uma **variável**; por isso os `set` abaixo.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    server_tokens off;

    # --- SSE (ranking ao vivo) ---------------------------------------------
    # Precisa vir antes de /api/ para ganhar a precedência do prefixo mais
    # longo. Buffering desligado, senão o evento fica preso no nginx.
    location /api/stream/ {
        set $api_sse http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $api_sse;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_set_header   Cache-Control     "no-cache";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # --- API ---------------------------------------------------------------
    # /api/health/live -> http://api:8000/health/live
    location /api/ {
        set $api_backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 3 minutos: a importação do Brasileirão faz 38 requisições espaçadas
        # ao GE e leva cerca de 40s. Com 60s ela morreria pelo caminho.
        proxy_read_timeout 180s;
    }

    # --- Frontend (Nuxt SSR + HMR) -----------------------------------------
    location / {
        set $web_backend http://web:3000;
        proxy_pass         $web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
