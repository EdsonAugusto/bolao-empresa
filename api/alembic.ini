[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# A URL real vem de app.core.config em alembic/env.py. Deixar vazio aqui é
# proposital: evita que alguém aponte migration para o banco errado por engano.
sqlalchemy.url =

# Nome do arquivo de revisão com data — histórico legível em ordem cronológica.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Sem hooks. `alembic/versions` está fora do ruff (ver pyproject.toml): código
# gerado não se beneficia de lint, e um hook que sai com código != 0 faz o
# `alembic revision` falhar depois de já ter escrito o arquivo — o pior dos
# dois mundos.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
