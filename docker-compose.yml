name: bolao

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bolao_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bolao}
      # Timezone do servidor em UTC. A conversão para America/Sao_Paulo é
      # responsabilidade da borda de apresentação, nunca do banco.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bolao} -d ${POSTGRES_DB:-bolao}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./api:/app
      # Anexo de relato fora do bind-mount do código: sobrevive a recriar o
      # container e não polui o repositório.
      - uploads_data:/data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./api
      target: dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./api:/app
      - uploads_data:/data/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  web:
    build:
      context: ./web
      target: dev
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_API_INTERNAL: http://api:8000
      NGINX_HOST_PORT: ${NGINX_HOST_PORT:-8080}
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api: {condition: service_started}
    # O volume nomeado em /app/node_modules nasce vazio e esconde o que a
    # imagem instalou; por isso a instalação é conferida na subida.
    command:
      - sh
      - -c
      - '[ -d node_modules/nuxt ] || npm install; exec npm run dev -- --host 0.0.0.0 --port 3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  uploads_data:
  postgres_data:
  redis_data:
  web_node_modules:
